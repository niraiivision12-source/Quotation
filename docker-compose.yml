services:
  postgres:
    image: postgres:17-alpine
    container_name: quotation-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - quotation-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: quotation-backend

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - /app/node_modules

    networks:
      - quotation-network

  frontend:
    build:
      context: ./frontend

    container_name: quotation-frontend

    restart: unless-stopped

    ports:
      - "3001:3001"

    env_file:
      - .env

    volumes:
      - ./frontend:/app
      - /app/node_modules

    networks:
      - quotation-network

  nginx:
    image: nginx:alpine

    container_name: quotation-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - frontend
      - backend

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - quotation-network

volumes:
  postgres-data:

networks:
  quotation-network:
